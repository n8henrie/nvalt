---
name: build

permissions:
  contents: write

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: build AutoHyperlinks
        working-directory: adium/Frameworks/AutoHyperlinks Framework
        run: |
          xcodebuild \
            -project AutoHyperlinks.framework.xcodeproj \
             -target AutoHyperlinks.framework \
             -configuration Release \
             VALID_ARCHS=arm64 \
             ARCHS=arm64 \
             build
      - name: build nvalt
        run: |
          set -x
          type -a nix
          nix build .#deps
          xcodebuild \
            -target Notation \
            -configuration ForBuilding \
            -scheme 'Notation Release' \
            -archivePath ./nvalt.xcarchive \
            archive
          ditto -c -k --keepParent nvalt.xcarchive/Products/Applications/nvALT.app nvALT.zip
      - uses: actions/upload-artifact@v7
        with:
          name: nvALT
          path: nvALT.zip
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            nvALT.zip
